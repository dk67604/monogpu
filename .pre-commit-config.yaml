# Pre-commit hooks. Shell-first MVP → shellcheck + basic hygiene only.
# Add Rust (fmt/clippy) or Python (ruff) hooks when those components land. See CLAUDE.md.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-executables-have-shebangs
      - id: mixed-line-ending

  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.10.0
    hooks:
      - id: shellcheck
        args: ["-e", "SC1091"]  # SC1091: sourced env.sh not followed at lint time
