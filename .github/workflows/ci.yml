name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run shellcheck on all shell scripts
        uses: ludeeus/action-shellcheck@master
        with:
          # env.sh is sourced (not executed); tell shellcheck it's bash.
          additional_files: 'env.sh'
        env:
          SHELLCHECK_OPTS: -e SC1091

  # Rust / Python jobs are intentionally absent: the MVP is shell-only.
  # Add a `rust` job (fmt + clippy -D warnings + nextest) when a Rust component
  # lands, and a `python` job (ruff + pytest) only if Python is ever introduced.
  # See CLAUDE.md.
